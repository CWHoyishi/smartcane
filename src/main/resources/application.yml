# 中国移动CMIOT OneNET 配置（适配你页面产品）
onenet:
  mqtt:
    host: tcp://896VnUK204.mqtts.acc.cmcconenet.cn:6002
    productId: 896VnUK204
    accessKey: 7X1jZfdrwz8HM0dF46c7+QcnXz1B65utlUsdYXclO20=
    subscribeTopic: $sys/896VnUK204/+/thing/property/post
    qos: 1
    keepAlive: 60
  api:
    # ===== CMIOT 官方 thingmodel API（2026-06-23 根据官方文档更新）=====
    # 文档来源: https://iot-api.heclouds.com
    #
    # 端点1 [最优先]: GET /thingmodel/query-device-property
    #   → 查询设备最新属性功能点数据（支持OneJson、自定义透传协议）
    #   参数: product_id, device_name
    #
    # 端点2: GET /thingmodel/query-device-property-history
    #   → 查询设备属性历史功能点数据
    #   参数: product_id, device_name, identifier, start_time(毫秒), end_time(毫秒)
    #
    # 端点3: POST /thingmodel/query-device-property-detail
    #   → 下发物模型属性获取命令到设备（仅支持OneJson设备，需设备在线）
    #   参数: product_id, device_name, params(array of identifiers)
    endpoints:
      - baseUrl: https://iot-api.heclouds.com
        path: /thingmodel/query-device-property
        method: GET
      - baseUrl: https://iot-api.heclouds.com
        path: /thingmodel/query-device-property-history
        method: GET
      - baseUrl: https://iot-api.heclouds.com
        path: /thingmodel/query-device-property-detail
        method: POST
    productId: 896VnUK204
    accessKey: 7X1jZfdrwz8HM0dF46c7+QcnXz1B65utlUsdYXclO20=
    deviceNames:
      - 862323084243065
    fetchIntervalMs: 60000
# 内网演示：只暴露健康检查与指标，供压测取基线（/actuator/health、/actuator/metrics）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics